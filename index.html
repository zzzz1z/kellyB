<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Aniversário da Kelly</title>
<link href="https://fonts.googleapis.com/css2?family=Meddon&family=Poppins:wght@300&display=swap" rel="stylesheet">
<style>
:root{--bg:#e7e6e1;--ink:#0f0f0f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:32px 16px 56px;overflow-x:hidden;text-align:center}
.cover{width:min(72vw,340px);aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:#1b1712;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.sans{font-family:Poppins,system-ui,sans-serif;font-weight:300}
.script{font-family:Meddon,"Brush Script MT",cursive;font-weight:400}
.a{margin-top:clamp(40px,10vh,90px);font-size:clamp(21px,6vw,28px);line-height:1.35}
.b{margin-top:clamp(34px,8vh,64px);font-size:clamp(34px,10vw,50px);line-height:1.15}
.c{margin-top:clamp(46px,11vh,96px);font-size:clamp(28px,8vw,40px)}
</style>
</head>
<body>
<div class="cover">
  <img src="images/take-care-cover.jpg" alt="Take Care">
</div>
  <div class="a sans">Você está exatamente<br>onde deveria estar.</div>
  <div class="b script">Aniversário da Kelly</div>
  <div class="c sans">Shot for me ?</div>
</body>
</html>
